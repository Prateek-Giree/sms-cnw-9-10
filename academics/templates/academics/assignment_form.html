{% extends 'base.html' %}

{% block title %}Assignment Upload{% endblock %}
{% block page_label %}Academics{% endblock %}
{% block page_title %}Create Assignment{% endblock %}

{% block content %}
<div class="mx-auto max-w-3xl rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">
  <form class="space-y-5">
    <div>
      <label for="title" class="mb-2 block text-sm font-medium text-slate-700">Title</label>
      <input id="title" type="text" placeholder="Fractions Practice Worksheet" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-slate-400 focus:bg-white" />
    </div>

    <div>
      <label for="subject" class="mb-2 block text-sm font-medium text-slate-700">Subject</label>
      <select id="subject" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-slate-400 focus:bg-white">
        <option>Mathematics</option>
        <option>Science</option>
        <option>English</option>
      </select>
    </div>

    <div>
      <label for="description" class="mb-2 block text-sm font-medium text-slate-700">Description</label>
      <textarea id="description" rows="5" placeholder="Describe the assignment instructions and expectations." class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none transition focus:border-slate-400 focus:bg-white"></textarea>
    </div>

    <div>
      <label for="file" class="mb-2 block text-sm font-medium text-slate-700">File Upload</label>
      <input id="file" type="file" class="w-full rounded-2xl border border-dashed border-slate-300 bg-slate-50 px-4 py-3 text-sm text-slate-500" />
    </div>

    <div class="flex justify-end">
      <button type="submit" class="rounded-2xl bg-slate-900 px-5 py-3 font-semibold text-white transition hover:bg-slate-800">Upload Assignment</button>
    </div>
  </form>
</div>
{% endblock %}
