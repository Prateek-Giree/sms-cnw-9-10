<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800">
    <div class="flex min-h-screen items-center justify-center bg-gradient-to-br from-emerald-50 via-white to-slate-100 px-4 py-10 sm:px-6 lg:px-8">
      <div class="w-full max-w-3xl rounded-[2rem] border border-slate-200 bg-white/90 p-8 shadow-sm backdrop-blur sm:p-10">
        <div class="text-center">
          <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-900 text-2xl font-semibold text-white">
            S
          </div>
          <h2 class="mt-5 text-3xl font-semibold text-slate-900">Welcome to the Student Portal</h2>
          <p class="mt-3 text-base text-slate-600">Enter your Student ID to access your academic dashboard.</p>
        </div>

        <form method="post" class="mt-8 space-y-5">
          {% csrf_token %}
          <div>
            <label for="student_id" class="mb-2 block text-sm font-medium text-slate-700">Student ID</label>
            <input
              id="student_id"
              name="student_id"
              type="text"
              inputmode="numeric"
              required
              placeholder="Enter Student ID"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-base shadow-sm outline-none transition focus:border-emerald-500 focus:ring-2 focus:ring-emerald-100"
            />
          </div>

          {% if error_message %}
          <div class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
            {{ error_message }}
          </div>
          {% endif %}

          <button type="submit" class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-base font-semibold text-white transition hover:bg-slate-800">
            Continue to Dashboard
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
